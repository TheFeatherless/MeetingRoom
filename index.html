<script id="appjs">
/* ===================== MEETING OFFICE — SOURCE GUIDE =====================

              dashboard section order: cfg.layout.order
  SIZE        dashboard section width: cfg.layout.w[section] (1-12 grid columns; 12 = full width)

 /* NAVIGATION: id = fixed internal page (never change); label = displayed text; array order = menu order (Settings stays last) */
 nav:[{id:'dash',label:'Dashboard'},{id:'cal',label:'Calendar'},{id:'recs',label:'Meeting Search'},{id:'set',label:'Settings'}],

 gen:()=>`<h2>General Settings</h2><label>Application Name</label><input id="s_n" data-g="name" value="${esc(c.name)}"><label>Application Description</label><textarea id="s_d" data-g="desc" rows="2">${esc(c.desc)}</textarea>
  <div class="two"><div><label>Default Calendar View</label><select id="s_v" data-g="defView">${optsOf([['month','Month'],['week','Week'],['day','Day'],['agenda','Agenda']],c.defView)}</select></div>
  <div><label>Date Format</label><select id="s_f" data-g="dateFmt">${optsOf(['DD/MM/YYYY','MM/DD/YYYY','YYYY-MM-DD'].map(x=>[x,x]),c.dateFmt)}</select></div>
  <div><label>Time Format</label><select id="s_h" data-g="hour12">${optsOf([['0','24-hour'],['1','12-hour']],c.hour12?1:0)}</select></div>
  <div><label>First Day of Week</label><select id="s_w" data-g="weekStart">${optsOf(['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'].map((d,i)=>[i,d]),c.weekStart)}</select></div></div>
  `,
 /* NAVIGATION: edits cfg.nav[].label (text) and array order (position). Only the displayed label changes. */
 nav:()=>`<h2>Navigation</h2><h3>Menu items</h3><p class="muted">Rename or reorder menu items. This changes only what people see; pages and data are unaffected. Settings always stays at the bottom.</p>${c.nav.map(n=>`<div class="fld"><div class="row"><div class="g"><label>${NAVD[n.id]}</label><input data-nl="${n.id}" value="${esc(navLabel(n.id))}"></div>${n.id==='set'?'':`<button data-nm="${n.id}:-1" aria-label="Move up">▲</button><button data-nm="${n.id}:1" aria-label="Move down">▼</button>`}</div></div>`).join('')}
  <h3>Settings tabs</h3><p class="muted">Rename or reorder the tabs on this page. Only the displayed names and order change; the tabs themselves work exactly the same.</p>${tabList().map(([id,l],i,a)=>`<div class="fld"><div class="row"><div class="g"><label>${STABS.find(x=>x[0]===id)[1]}</label><input data-tl="${id}" value="${esc(l)}"></div><button data-tm="${id}:-1" ${i?'':'disabled'} aria-label="Move up">▲</button><button data-tm="${id}:1" ${i<a.length-1?'':'disabled'} aria-label="Move down">▼</button></div></div>`).join('')}`,
 /* MEETING FIELDS: list only; the Edit button opens fieldBox(). Array order here = order in the form. */
 fld:()=>`<div class="row"><h2 class="g" style="margin:0">Meeting Fields</h2><button class="p" data-act="addf">+ Add field</button></div><p class="muted">These fields drive both the Add/Edit Meeting form and the Meeting Search filters.</p>${c.fields.map((f,i)=>`<div class="fld"><div class="row"><div class="g"><b>${esc(f.label)}</b><br><span class="muted">${TYPES[f.type]} · ${f.required?'Required':'Optional'} · ${f.visible===false?'Hidden':'Visible'}</span></div><button data-fm="${f.id}:-1" aria-label="Move up" ${i?'':'disabled'}>▲</button><button data-fm="${f.id}:1" aria-label="Move down" ${i<c.fields.length-1?'':'disabled'}>▼</button><button data-editf="${f.id}">Edit</button><button class="d" data-delf="${f.id}">Delete</button></div></div>`).join('')}`,
  /* DASHBOARD SETTINGS: three sub-sections (S.dsub). Appearance = titles/layout/spacing/size/alignment/density (cfg.dash, cfg.carousel.per);
    Cards = add/edit/delete/enable/reorder (cfg.cards); Visibility = which Dashboard sections show (cfg.dash.visible). */
 dsh:()=>{const D=c.dash,T=D.titles,sub=S.dsub||'app',
  tx=(k,l)=>`<div><label>${l}</label><input data-dt="${k}" value="${esc(T[k]||'')}" placeholder="${esc(k==='main'?navLabel('dash'):BL[k][0])}"></div>`,
  sel=(k,l,o)=>`<div><label>${l}</label><select data-da="${k}">${optsOf(o,D[k])}</select></div>`,
  B={app:()=>`<h3>Titles</h3><p class="muted">Leave a title blank to use its default.</p><div class="two">${tx('main','Dashboard main title')}${tx('stats','Overview title')}${tx('cards','Announcement title')}${tx('upcoming','Upcoming Meetings title')}${tx('today',"Today's Schedule title")}</div>`,
   ann:()=>`<h3>Announcement</h3><div class="two">${sel('layout','Card layout',[['carousel','Rotating carousel'],['grid','Show all cards (grid)']])}<div><label>Cards per row</label><select data-per="1">${optsOf([1,2,3,4].map(x=>[x,x]),c.carousel.per||3)}</select></div>
   <div><label>Card spacing (px)</label><input type="number" min="0" max="48" data-da="gap" value="${D.gap}"></div><div><label>Default card height (px, 0 = automatic)</label><input type="number" min="0" max="400" data-da="ch" value="${D.ch}"></div>
   ${sel('align','Card alignment',[['left','Left'],['center','Centered']])}${sel('density','Density',[['comfortable','Spacious'],['compact','Compact']])}</div>
   <h3>Announcement cards</h3><p class="muted">Each card counts meetings for one Meeting Field value, or shows the next meetings (Coming Up card type). Add, edit, enable, reorder or delete cards here; the Edit dialog controls title, icon, filter, size and click action.</p>${cardAdmin(false)}`,
      ov:()=>{const L=c.ovCards||[];return`<h3>Overview cards</h3><p class="muted">The cards under the Overview title. Any number can be shown. Built-in cards can be hidden or deleted; Restore Defaults brings them back.</p><div class="row"><button class="p" data-ovadd="1">+ Add Overview Card</button></div><div style="margin-top:12px">${L.map((o,i)=>`<div class="fld"><div class="row"><label class="ck" style="margin:0"><input type="checkbox" data-oe="${o.id}" ${o.enabled!==false?'checked':''} aria-label="Enabled"></label><span class="g"><b>${esc(o.kind?OVN[o.kind]:cardTitle(o))}</b> <span class="muted">${o.kind?'Built-in':'Custom'}${o.kind||cardOK(o)?'':' · unavailable'}</span></span><button data-om="${o.id}:-1" ${i?'':'disabled'} aria-label="Move up">▲</button><button data-om="${o.id}:1" ${i<L.length-1?'':'disabled'} aria-label="Move down">▼</button>${o.kind?'':`<button data-ovedit="${o.id}">Edit</button>`}<button class="d" data-ovdel="${o.id}">Delete</button></div></div>`).join('')||'<p class="muted">No overview cards.</p>'}</div>`},
   cu:()=>{const o=fullOrd(c.layout.order),i=o.indexOf('coming'),U=D.cu||{},uf=U.fields||[],
    sl=(k,l,op,v)=>`<div><label>${l}</label><select data-cu="${k}">${optsOf(op,v)}</select></div>`,nm=(k,l,v)=>`<div><label>${l}</label><input type="number" data-cu="${k}" min="1" max="720" value="${v}"></div>`;
   return`<h3>Coming Up</h3><p class="muted">A live countdown to the next meeting that has not started, followed by the meetings after it. Only the closest meeting shows the countdown; it moves on automatically when that meeting starts.</p>
    <label class="ck"><input type="checkbox" data-dv="coming" ${D.visible.coming!==false?'checked':''}> Show Coming Up on the Dashboard</label>
    <div class="two">${tx('coming','Title')}<div><label>Size</label><select data-lw="coming">${optsOf([[4,'Small'],[6,'Medium'],[8,'Large'],[12,'Full width']],c.layout.w.coming||12)}</select></div>
    ${sl('count','Number of meetings (1-4)',[1,2,3,4].map(x=>[x,x]),U.count||3)}${sl('layout','Layout',[['featured','Featured (large countdown)'],['compact','Compact']],U.layout||'featured')}${sl('icon','Icon',ICONS,U.icon||'')}
    ${sl('action','Click action',[['search','Meeting Search (upcoming meetings)'],['recs','Meeting Search (default filters)'],['calendar','Open Calendar'],['add','Add a meeting'],['detail','Open the clicked meeting’s details (Coming Up)'],['none','No action (not clickable)']],U.action||'search')}</div>
    <label>Position</label><div class="row"><button data-lm="coming:-1" ${i>0?'':'disabled'}>▲ Move up</button><button data-lm="coming:1" ${i<o.length-1?'':'disabled'}>▼ Move down</button><span class="muted">Position ${i+1} of ${o.length}</span></div>
    <h3>Countdown rules</h3><p class="muted">More than the first value: whole days only ("2 Days"). Between the two values: hours and minutes. Within the second value: minutes and seconds are shown too.</p><div class="two">${nm('dayHours','Show days only when more than (hours away)',U.dayHours||24)}${nm('secHours','Show minutes and seconds within (hours)',U.secHours||7)}</div>
    <h3>Displayed meeting information</h3><p class="muted">The meeting title, date, time and countdown always show. Tick any extra details to include.</p>${VF().filter(f=>!['title','date','start','end'].includes(f.id)).map(f=>`<label class="ck"><input type="checkbox" data-cf="${f.id}" ${uf.includes(f.id)?'checked':''}> ${esc(f.label)}</label>`).join('')}`},
   vis:()=>`<h3>Visible dashboard sections</h3>${Object.keys(BL).map(k=>`<label class="ck"><input type="checkbox" data-dv="${k}" ${D.visible[k]!==false?'checked':''}> ${esc(DT(k))}</label>`).join('')}`};
  return`<h2>Dashboard Settings</h2><div class="tabs">${[['app','Appearance'],['ann','Announcement Cards'],['ov','Overview Cards'],['cu','Coming Up'],['vis','Visibility']].map(x=>`<button class="tab ${sub===x[0]?'on':''}" data-dsub="${x[0]}">${x[1]}</button>`).join('')}</div>${B[sub]()}`},
 /* SEARCH: cfg.search.defaultFilters (filters active on open) and cfg.search.exclude (fields skipped by text search) */
 sea:()=>`<h2>Search Settings</h2><h3>Default Meeting Search Filters</h3><p class="muted">Checked filters are active when Meeting Search opens. Users can still add or remove them with the Filter button.</p>${FK().map(k=>`<label class="ck"><input type="checkbox" data-df="${k.id}" ${c.search.defaultFilters.includes(k.id)?'checked':''}> ${esc(k.label)}</label>`).join('')}<h3>Fields included in text search</h3><p class="muted">What the header search bar looks through.</p>${VF().map(f=>`<label class="ck"><input type="checkbox" data-sc="${f.id}" ${c.search.exclude.includes(f.id)?'':'checked'}> ${esc(f.label)}</label>`).join('')}`,
 lay:()=>`<h2>Layout</h2><p class="muted">Fast Edit Mode: drag dashboard sections, nudge them with the arrow buttons, set their width, and resize the header.</p><div class="row"><button data-act="fast" class="${S.fast?'p':''}">Fast Edit Mode: ${S.fast?'On':'Off'}</button><button data-act="resetlay">Reset layout</button></div>`,
 bak:()=>`<h2>Backup &amp; History</h2><p class="muted">Export saves the settings and configuration (not meetings) as a JSON backup. The Settings passkey is never included.</p><div class="row"><button data-act="export">Export configuration</button><button data-act="import">Import configuration</button><input type="file" id="imp" accept=".json" hidden></div><h3>Configuration history</h3>${(c.history||[]).map((h,i)=>`<div class="row" style="margin-bottom:6px"><span class="g">${new Date(h.ts).toLocaleString()} — ${esc(h.note)}</span><button data-hist="${i}">Restore</button></div>`).join('')||'<p class="muted">No saved versions yet.</p>'}`,
 /* PATCH NOTES: current version, one-step rollback/restore (switchV), editable notes per version, and creating a new version */
 ptc:()=>{const V=c.versions,ci=V.list.findIndex(x=>x.v===V.cur),pv=V.prev,bl=n=>String(n||'').split('\n').map(x=>x.replace(/^[\s\-•*]+/,'').trim()).filter(Boolean);
  return`<h2>Patch Notes</h2><p>Current version: <b>v${V.cur}</b></p><div class="row"><button class="d" data-act="vback" ${pv?'':'disabled'}>${pv?(pv.v<V.cur?'Roll back to v':'Restore v')+pv.v:'No previous version saved'}</button></div><p class="muted">Only one previous version is kept: the immediately previous one. Rolling back restores that version's saved Settings configuration (meetings and application code are not changed), and the version you leave becomes the single stored previous version. No older versions are stored.</p>
   <h3>Version history</h3>${V.list.map((x,i)=>[x,i]).reverse().map(([x,i])=>`<div class="fld"><b>v${x.v}</b>${x.v===V.cur?' <span class="badge upcoming">Current</span>':''}${x.date?` <span class="muted">${esc(x.date)}</span>`:''}<ul class="pn">${bl(x.notes).map(b=>`<li>${esc(b)}</li>`).join('')||'<li class="muted">No notes.</li>'}</ul><details><summary>Edit notes</summary><label for="vn${i}">One change per line</label><textarea id="vn${i}" data-vn="${i}" rows="4">${esc(x.notes||'')}</textarea></details></div>`).join('')}
   <h3>Create new version</h3>${ci===V.list.length-1?`<label for="nv_n">Changes in the new version (one per line)</label><textarea id="nv_n" rows="3"></textarea><p><button data-act="vnew">Create v${nextV(V.cur)}</button></p>`:'<p class="muted">New versions can only be created from the latest version.</p>'}`},
 /* ADVANCED: read-only source viewer. There is no live code editor: edit a copy and publish it again. */
 adv:()=>`<h2>Code / Advanced</h2><div class="warn">Advanced area for administrators. This is the application's source code (styles and script), shown read-only. Editing code can break the app, and changes only take effect after the page is republished.</div><div class="row"><button data-act="copysrc">Copy all code</button></div><label for="srcv">Application source</label><textarea id="srcv" readonly rows="22" spellcheck="false" style="font-family:ui-monospace,Consolas,monospace;font-size:.8rem;white-space:pre">${esc(srcText())}</textarea>`};
 const dirty=isDirty();return`<div class="sbar"><span role="status">${dirty?'● You have unsaved changes':'All changes saved'}</span><button class="p" data-act="savecfg" ${dirty?'':'disabled'}>Save Changes</button></div><div class="sl"><div class="tabs vt" role="tablist">${tabList().map(x=>`<button role="tab" aria-selected="${t===x[0]}" class="tab ${t===x[0]?'on':''}" data-tab="${x[0]}">${x[1]}</button>`).join('')}</div><div class="card tp" role="tabpanel">${P[t]()}${RD[t]?`<div class="row" style="margin-top:20px;padding-top:14px;border-top:1px solid var(--bd)"><button class="d" data-act="rdef">Restore Defaults</button><span class="muted">Resets only this section; press Save Changes to keep it.</span></div>`:''}</div></div>`}
/* fieldBox: editor for ONE field — name (label), type, required, visible, options. Position is changed with the ▲▼ buttons in the list.
   Changing the type keeps stored meeting values; options are kept even when the type is not Dropdown. */
function fieldBox(id){const f=F(id);modal(`<h2>Edit field</h2><label>Field name</label><input id="e_l" value="${esc(f.label)}"><label>Field type</label><select id="e_t">${optsOf(Object.entries(TYPES),f.type)}</select>
 <div id="e_o" ${f.type==='dropdown'?'':'hidden'}><label>Options (one per line)</label><textarea id="e_op" rows="5">${esc(f.options.join('\n'))}</textarea></div>
 <label class="ck"><input type="checkbox" id="e_r" ${f.required?'checked':''}> Required</label><label class="ck"><input type="checkbox" id="e_v" ${f.visible!==false?'checked':''}> Visible (shown in forms and as a search filter)</label>
 <div class="row" style="margin-top:14px"><button data-x="close">Cancel</button><button class="p" id="e_s">Save field</button></div>`);
 $('#e_t').onchange=()=>{$('#e_o').hidden=$('#e_t').value!=='dropdown';if(!$('#e_op').value.trim())$('#e_op').value=[...new Set(S.meetings.map(m=>m.v[f.id]).filter(v=>v&&typeof v==='string'))].join('\n')};
 $('#e_s').onclick=()=>{const c=clone(S.cfg),g=c.fields.find(x=>x.id===id);g.label=$('#e_l').value.trim()||g.label;g.type=$('#e_t').value;g.options=$('#e_op').value.split('\n').map(x=>x.trim()).filter(Boolean);g.required=$('#e_r').checked;g.visible=$('#e_v').checked;close();saveCfg(c,'Edited field “'+g.label+'”')}}
/* render */
function render(){const c=S.cfg;/* HEADER TITLE = label of the current page (cfg.nav). Search bar is hidden on Settings (S.view==='set'). */
 $('#an').textContent=S.view==='dash'&&S.cfg.dash.titles.main?S.cfg.dash.titles.main:navLabel(S.view);document.title=c.name+' — '+navLabel(S.view);$('#hsw').hidden=S.view==='set';
 const hh=c.layout.hh??12;$('#hd').style.setProperty('--hh',hh+'px');$('#hd').classList.toggle('fe-h',S.fast);
 $('#nav').innerHTML='<button class="p" data-add="1">+ Add meeting</button>'+(S.fast?'<button class="p" data-act="fast">Fast Edit: On — Done</button>':'');
 $('#hfe').innerHTML=S.fast?`<div class="fb hfb"><b>Header size</b><button data-hh="-8">− Smaller</button><button data-hh="8">+ Larger</button>${[['Compact',0],['Standard',12],['Large',32],['Extra large',56]].map(q=>`<button data-hh="=${q[1]}" class="${hh===q[1]?'p':''}">${q[0]}</button>`).join('')}</div>`:'';
 /* DRAWER MENU: items in cfg.nav order, labels from cfg.nav[].label; Settings pinned at the bottom (passkey). */
 $('#dr').innerHTML=`<div class="dh"><b>☰ ${esc(c.name)}</b><button data-drawer="0" aria-label="Close menu">✕</button></div>${c.nav.filter(n=>n.id!=='set').map(n=>`<button class="dl ${S.view===n.id?'on':''}" data-view="${n.id}">${esc(navLabel(n.id))}</button>`).join('')}<div class="ds"><button class="dl ${S.view==='set'?'on':''}" data-view="set">🔒 ${esc(navLabel('set'))}</button><small class="muted">Passkey required</small></div>`;
 const a=document.activeElement,keep=a&&a.id;
 $('#app').innerHTML=(S.live?'':'<div class="warn">Shared storage is unavailable in this view. Meetings and settings will not be saved or shared.</div>')+({dash,cal:calView,recs,set:settings}[S.view])();
 if(keep&&$('#'+keep)&&['INPUT','TEXTAREA'].includes(a.tagName))$('#'+keep).focus()}
/* navigation */
function closeDr(){$('#dr').classList.remove('open');$('#dv').style.display='none'}
/* SETTINGS PASSKEY: the code is PASSKEY below (exactly 4 digits). The field accepts digits only, max 4, and shows a numeric keypad on phones
   (inputmode="numeric"). A correct code opens Settings immediately; a wrong one shows the message in #pe. Change the code by editing PASSKEY. */
const PASSKEY='0000';
function askKey(){modal(`<h2>Settings passkey</h2><label for="pk">Enter the 4-digit passkey to open Settings</label><input type="password" id="pk" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" aria-describedby="pe"><p id="pe" class="muted" role="alert" style="min-height:1.5em;margin:8px 0 0"></p><div class="row" style="margin-top:10px"><button data-x="close">Cancel</button><button class="p" id="pkb">Unlock</button></div>`);
 const k=$('#pk'),e=$('#pe'),go=()=>{const v=k.value;
  if(v.length<4){e.style.color='var(--dg)';e.textContent='Please enter all 4 digits.';return}
  if(v===PASSKEY){close();S.view='set';S.fast=false;render()}
  else{e.style.color='var(--dg)';e.textContent='Incorrect passkey. Please check the code and try again.';k.value='';k.focus()}};
 k.oninput=()=>{k.value=k.value.replace(/\D/g,'').slice(0,4);e.textContent='';if(k.value.length===4)go()};
 $('#pkb').onclick=go;k.onkeydown=ev=>{if(ev.key==='Enter')go()};k.focus()}
/* CALENDAR QUICK ADD: double-click any element carrying data-date (month cell, week day, day view) to open Add Meeting with that date. */
document.addEventListener('dblclick',e=>{const c=e.target.closest('[data-date]');if(c&&!e.target.closest('[data-open],a,button'))form(null,c.dataset.date)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeDr();close()}if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('[data-open][tabindex]')){e.preventDefault();e.target.click()}});
/* events */
document.addEventListener('click',e=>{const t=e.target.closest('button,[data-open],[data-day],[data-x]');if(!t){if(e.target.id==='modal')close();if(e.target.id==='dv')closeDr();return}const d=t.dataset;
 if(d.x)return close();if(d.cc){if(!S.fast)openCustom(d.cc);return}
 if(d.cs!==undefined){S.t=0;S.slide=d.cs[0]==='='?+d.cs.slice(1):(S.slide||0)+ +d.cs;return refreshCar()}
 if(d.tm){const c=clone(S.cfg),[id,n]=d.tm.split(':'),a=tabList().map(([i,l])=>({id:i,label:l})),i=a.findIndex(x=>x.id===id),j=i+ +n;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];c.settingsTabs=a;return saveCfg(c)}
 if(d.om){const c=clone(S.cfg),[id,n]=d.om.split(':'),a=c.ovCards,i=a.findIndex(x=>x.id===id),j=i+ +n;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];return saveCfg(c)}
  if(d.lm){const c=clone(S.cfg),[id,n]=d.lm.split(':'),o=c.layout.order=fullOrd(c.layout.order),i=o.indexOf(id),j=i+ +n;if(j<0||j>=o.length)return;[o[i],o[j]]=[o[j],o[i]];return saveCfg(c)}
 if(d.dsub){S.dsub=d.dsub;return render()}
 if(d.cm){const c=clone(S.cfg),[id,n]=d.cm.split(':'),a=c.cards,i=a.findIndex(x=>x.id===id),j=i+ +n;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];return saveCfg(c,'Reordered cards')}
 if(d.ovadd)return cardBox(undefined,'ovCards');
 if(d.ovedit)return cardBox(d.ovedit,'ovCards');
 if(d.ovdel)return confirmBox('Delete this overview card?','Delete',()=>{const c=clone(S.cfg);c.ovCards=c.ovCards.filter(x=>x.id!==d.ovdel);saveCfg(c,'Deleted overview card')});
 if(d.cardadd)return cardBox();
 if(d.cardedit)return cardBox(d.cardedit);
 if(d.carddel)return confirmBox('Delete this dashboard card?','Delete',()=>{const c=clone(S.cfg);c.cards=c.cards.filter(x=>x.id!==d.carddel);saveCfg(c,'Deleted dashboard card')});
 if(d.card){if(!S.fast)openCard(d.card);return}
 if(d.drawer!==undefined){$('#dr').classList.toggle('open',d.drawer==='1');$('#dv').style.display=d.drawer==='1'?'block':'none';return}
 if(d.view){closeDr();if(d.view!=='set'&&S.view==='set'&&isDirty())return guard(()=>go(d.view));return go(d.view)}
 if(d.tab){S.tab=d.tab;return render()}
 if(d.editf)return fieldBox(d.editf);
 if(d.fm||d.nm){const c=clone(S.cfg),[id,n]=(d.fm||d.nm).split(':');let a=d.fm?c.fields:c.nav.filter(x=>x.id!=='set'),i=a.findIndex(x=>x.id===id),j=i+ +n;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];if(d.nm)c.nav=[...a,c.nav.find(x=>x.id==='set')];return saveCfg(c,'Reordered '+(d.fm?'fields':'navigation'))}
 if(d.hh){const c=clone(S.cfg),L=c.layout,cur=L.hh??12,v=d.hh[0]==='='?+d.hh.slice(1):cur+ +d.hh;L.hh=Math.max(0,Math.min(56,v));return saveCfg(c,'Header resized')}if(d.add)return form();
 if(d.open)return detail(d.open);if(d.edit){const m=S.meetings.find(x=>x.id===d.edit);return form(m)}
 if(d.day){e.preventDefault();S.cur=pd(d.day);S.mode='day';return render()}
 if(d.mode){S.mode=d.mode;return render()}
 if(d.nav!==undefined){const n=+d.nav,m=S.mode,c=S.cur;S.cur=n===0?new Date():m==='month'?new Date(c.getFullYear(),c.getMonth()+n,1):addD(c,n*(m==='week'?7:m==='day'?1:30));return render()}
 if(d.cancel)return confirmBox('Cancel this meeting?','Cancel meeting',r=>{const m=S.meetings.find(x=>x.id===d.cancel);saveM(m.id,{v:m.v,status:'cancelled',reason:r.trim(),created:m.created||0});toast('Meeting cancelled.')},'<label>Cancellation reason (optional)</label><textarea id="cr" rows="3"></textarea>');
 if(d.restore){const m=S.meetings.find(x=>x.id===d.restore);saveM(m.id,{v:m.v,status:'scheduled',reason:'',created:m.created||0});return close()}
 if(d.del)return confirmBox('Delete this meeting permanently?','Delete',()=>{delM(d.del);toast('Meeting deleted.')});
 if(d.delf){const f=F(d.delf);return confirmBox('Are you sure you want to delete this field?','Delete',()=>{const c=clone(S.cfg);c.fields=c.fields.filter(x=>x.id!==f.id);saveCfg(c,'Deleted field “'+f.label+'”')},`<p class="muted">${esc(f.label)}</p>`)}
 if(d.hist){const h=S.cfg.history[+d.hist];return confirmBox('Restore this configuration version?','Restore',()=>{const c={...clone(h.cfg),history:S.cfg.history,versions:S.cfg.versions};saveCfg(c,'Restored version from '+new Date(h.ts).toLocaleString())})}
 if(d.mv){const[k,n]=d.mv.split(':'),c=clone(S.cfg),o=c.layout.order=fullOrd(c.layout.order),i=o.indexOf(k),j=Math.max(0,Math.min(o.length-1,i+ +n));o.splice(j,0,o.splice(i,1)[0]);return saveCfg(c,'Layout changed')}
 if(d.w){const[k,n]=d.w.split(':'),c=clone(S.cfg);c.layout.w[k]=+n;return saveCfg(c,'Layout changed')}
 const act=d.act;if(act==='fast'){if(!S.fast&&S.view==='set'&&isDirty())return guard(()=>{S.fast=true;S.view='dash';render()});S.fast=!S.fast;if(S.fast)S.view='dash';return render()}
  if(act==='addf'){const c=clone(S.cfg);c.fields.push({id:'f_'+uid(),label:'New field',type:'text',required:false,options:[],builtin:false});const nid=c.fields[c.fields.length-1].id;saveCfg(c,'Added field');return fieldBox(nid)}
 if(act==='filt')return filterBox();
 if(act==='savecfg')return saveSettings();
 if(act==='rdef'){const nm=tabList().find(x=>x[0]===S.tab)[1];return confirmBox('Restore defaults for “'+nm+'”?','Restore Defaults',()=>{const c=clone(S.cfg),d=DEF();RD[S.tab].forEach(k=>c[k]=d[k]);saveCfg(c);toast('Defaults restored. Press Save Changes to apply them.')},'<p>Only this section is reset. The reset is not permanent until you press Save Changes.</p>')}
 if(act==='vback')return switchV();
 if(act==='vnew'){if(isDirty())return toast('Save or discard your Settings changes first.');const c=clone(S.cfg),V=c.versions,ci=V.list.findIndex(x=>x.v===V.cur);V.prev={v:V.cur,snap:snapOf(c)};const v=nextV(V.cur);V.list.push({v,date:ymd(new Date()),notes:$('#nv_n').value.trim()});V.cur=v;persist(c,'Created version v'+v);return toast('Version v'+v+' created.')}
 if(act==='deffilt'){resetFilters();S.q='';$('#hq').value='';return render()}
 if(act==='clearf'){S.fl.vals={};return render()}
 if(act==='copysrc')return(async()=>{const t=$('#srcv');t.select();let ok=false;try{await navigator.clipboard.writeText(t.value);ok=true}catch(e){try{ok=document.execCommand('copy')}catch(x){}}toast(ok?'Code copied.':'Copy failed. Select the text and copy it manually.')})()
 if(act==='resetlay'){const c=clone(S.cfg);c.layout=DEF().layout;return saveCfg(c,'Layout reset')}
 if(act==='export'){return(async()=>{try{const dl=await claude.use('downloads');await dl.save({filename:'meeting-office-config.json',data:JSON.stringify({format:'meeting-office-config',version:S.cfg.versions.cur,exportedAt:new Date().toISOString(),config:snapOf(S.cfg),patchNotes:S.cfg.versions.list.map(x=>({v:x.v,date:x.date,notes:x.notes}))},null,2)})}catch(x){toast('Export unavailable or declined.')}})()}
 if(act==='import')return $('#imp').click()});
document.addEventListener('change',e=>{const t=e.target;
 if(t.id==='imp'){const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);const x=j.config||j;if(!Array.isArray(x.fields))throw 0;saveCfg({...DEF(),...x,history:S.cfg.history,versions:S.cfg.versions},'Imported configuration')}catch(x){toast('Invalid configuration file.')}};r.readAsText(t.files[0]);return}
  if(t.id==='jump'&&t.value){S.cur=pd(t.value);return render()}
 if(t.dataset.secs!==undefined||t.dataset.per!==undefined){const c=clone(S.cfg);if(t.dataset.secs!==undefined)c.carousel.secs=Math.max(5,Math.min(120,+t.value||15));else c.carousel.per=+t.value;return saveCfg(c,'Carousel settings')}
 if(t.dataset.dt!==undefined||t.dataset.da!==undefined||t.dataset.dv!==undefined||t.dataset.ce!==undefined){const c=clone(S.cfg),D=c.dash;
  if(t.dataset.dt!==undefined)D.titles[t.dataset.dt]=t.value.trim();else if(t.dataset.da!==undefined)D[t.dataset.da]=t.type==='number'?Math.max(0,+t.value||0):t.value;
  else if(t.dataset.dv!==undefined)D.visible[t.dataset.dv]=t.checked;else c.cards.find(x=>x.id===t.dataset.ce).enabled=t.checked;return saveCfg(c,'Dashboard settings')}
 if(t.dataset.tl!==undefined){const c=clone(S.cfg);c.settingsTabs=tabList().map(([id,label])=>({id,label}));c.settingsTabs.find(x=>x.id===t.dataset.tl).label=t.value.trim()||STABS.find(x=>x[0]===t.dataset.tl)[1];return saveCfg(c)}
 if(t.dataset.oe!==undefined){const c=clone(S.cfg);c.ovCards.find(x=>x.id===t.dataset.oe).enabled=t.checked;return saveCfg(c)}
   if(t.dataset.lw!==undefined){const c=clone(S.cfg);c.layout.w[t.dataset.lw]=+t.value;return saveCfg(c)}
 if(t.dataset.cf!==undefined){const c=clone(S.cfg),U=c.dash.cu=c.dash.cu||{};const a=new Set(U.fields||[]);t.checked?a.add(t.dataset.cf):a.delete(t.dataset.cf);U.fields=VF().map(f=>f.id).filter(x=>a.has(x));return saveCfg(c)}
 if(t.dataset.cu!==undefined){const c=clone(S.cfg),U=c.dash.cu=c.dash.cu||{},k=t.dataset.cu;U[k]=['count','dayHours','secHours'].includes(k)?Math.max(1,+t.value||1):t.value;U.count=Math.min(4,U.count||3);if((U.secHours||7)>(U.dayHours||24))U.secHours=U.dayHours;return saveCfg(c)}
 if(t.dataset.g){const c=clone(S.cfg),g=t.dataset.g,v=t.value;c[g]=g==='hour12'?v==='1':g==='weekStart'?+v:g==='name'?(v.trim()||'Meeting Office'):g==='desc'?v.trim():v;return saveCfg(c)}
 if(t.dataset.vn!==undefined){const c=clone(S.cfg);const e=c.versions.list[+t.dataset.vn];e.notes=t.value;e.edited=true;return saveCfg(c)}
 if(t.dataset.nl){const c=clone(S.cfg);c.nav.find(n=>n.id===t.dataset.nl).label=t.value.trim()||NAVD[t.dataset.nl];return saveCfg(c,'Renamed menu item')}
 if(t.dataset.df!==undefined||t.dataset.sc!==undefined){const c=clone(S.cfg),df=t.dataset.df!==undefined,id=df?t.dataset.df:t.dataset.sc,a=new Set(df?c.search.defaultFilters:c.search.exclude);(df?t.checked:!t.checked)?a.add(id):a.delete(id);
  if(df)c.search.defaultFilters=FK().map(k=>k.id).filter(x=>a.has(x));else c.search.exclude=[...a];return saveCfg(c,df?'Default filters':'Search scope')}});
document.addEventListener('input',e=>{const t=e.target;
 if(t.id==='hq'){S.q=t.value;if(S.view!=='recs'){resetFilters();S.view='recs';S.fast=false;render()}else $('#rl').innerHTML=recList();return}
 if(t.dataset.fv){S.fl.vals[t.dataset.fv]={...(S.fl.vals[t.dataset.fv]||{}),[t.dataset.vk]:t.value};$('#rl').innerHTML=recList()}});
/* FAST EDIT DRAG: drag a dashboard section onto another to reorder it (writes cfg.layout.order). */
let dragK=null;
/* CARD RESIZE (Fast Edit Mode): drag the corner handle (.rh) of a card; width snaps to columns (c.w), height is pixels (c.h). Saved on release. */
document.addEventListener('pointerdown',e=>{const h=e.target.closest('.rh');if(!h)return;e.preventDefault();S.rz=1;const w=h.parentNode,per=perView(),unit=w.parentNode.clientWidth/per,sw=w.offsetWidth,sh=w.offsetHeight,x0=e.clientX,y0=e.clientY,id=h.dataset.rz;let span=Math.max(1,Math.min(per,Math.round(sw/unit))),H=sh;
 const mv=ev=>{span=Math.max(1,Math.min(per,Math.round((sw+ev.clientX-x0)/unit)));H=Math.max(60,Math.round(sh+ev.clientY-y0));w.style.gridColumn='span '+span;w.style.minHeight=H+'px'},
  up=()=>{removeEventListener('pointermove',mv);removeEventListener('pointerup',up);setTimeout(()=>S.rz=0,0);const c=clone(S.cfg),k=c.cards.find(x=>x.id===id);k.w=span;k.h=H;saveCfg(c,'Resized card')};
 addEventListener('pointermove',mv);addEventListener('pointerup',up)});
document.addEventListener('dragstart',e=>{if(S.rz)return e.preventDefault();const b=e.target.closest('[data-blk]');if(b&&S.fast){dragK=b.dataset.blk;e.dataTransfer.effectAllowed='move'}});
document.addEventListener('dragover',e=>{const b=e.target.closest('[data-blk]');if(b&&dragK){e.preventDefault();document.querySelectorAll('.over').forEach(x=>x.classList.remove('over'));b.classList.add('over')}});
document.addEventListener('drop',e=>{const b=e.target.closest('[data-blk]');if(!b||!dragK)return;e.preventDefault();const c=clone(S.cfg),o=c.layout.order=fullOrd(c.layout.order),j=o.indexOf(b.dataset.blk);o.splice(o.indexOf(dragK),1);o.splice(j,0,dragK);dragK=null;saveCfg(c,'Layout changed')});
document.addEventListener('dragend',()=>{dragK=null;document.querySelectorAll('.over').forEach(x=>x.classList.remove('over'))});
init();
</script></body></html>
